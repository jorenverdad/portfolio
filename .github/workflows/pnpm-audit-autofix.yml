name: Scheduled Security Audit & Autofix

on:
  schedule:
    # Runs at 00:00 on the 1st day of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Run audit & fix (update dependencies)
        run: |
          pnpm audit --fix=update || true

      - name: Run audit & fix (override nested dependencies)
        run: |
          pnpm audit --fix=override || true

      - name: Regenerate Lockfile and Install
        run: |
          pnpm install --no-frozen-lockfile

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "security: resolve package vulnerabilities via pnpm audit"
          branch: pnpm-security-updates
          delete-branch: true
          title: "security: resolve package vulnerabilities"
          body: |
            This is an automated pull request to resolve security vulnerabilities detected in dependencies.

            ### Actions Taken:
            1. Ran `pnpm audit --fix=update` to upgrade direct dependencies within their semantic ranges.
            2. Ran `pnpm audit --fix=override` to add overrides for transitive (nested) dependencies in `pnpm-workspace.yaml`.
            3. Regenerated the `pnpm-lock.yaml` file using `pnpm install --no-frozen-lockfile`.

            Please review the changes, verify the lockfile updates, and ensure all tests pass before merging.
          labels: |
            security
            dependencies
